apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: java-microservice
spec:
  selector:
    matchLabels:
      app: order-service
  replicas: 1
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: bomeravi/order-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql-order-service:3306/order_service
        - name: SPRING_DATASOURCE_USERNAME
          value: root
        - name: SPRING_DATASOURCE_PASSWORD
          value: mysql
        - name: INVENTORY_URL
          value: http://inventory-service:8080
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: broker:29092
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: java-microservice
spec:
  selector:
    app: order-service
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
