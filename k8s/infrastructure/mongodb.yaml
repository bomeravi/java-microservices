apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-product-service
  namespace: java-microservice
spec:
  selector:
    matchLabels:
      app: mongodb-product-service
  replicas: 1
  template:
    metadata:
      labels:
        app: mongodb-product-service
    spec:
      containers:
      - name: mongodb-product-service
        image: mongo:7.0.5
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: root
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: password
        - name: MONGO_INITDB_DATABASE
          value: product-service
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
      volumes:
      - name: mongodb-data
        emptyDir: {} 
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-product-service
  namespace: java-microservice
spec:
  selector:
    app: mongodb-product-service
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
